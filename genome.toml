# genome.toml — switchpost's role→path map and genome modules.
# Converted from kb.toml (2026-10-19): the same role→path map, with the
# retired `closed` role dropped (it named the same standing-notes list as
# `ledger`) and `dated_pattern` moved from [paths] to [core], where the
# genome reads it.
#
# Pointer forms: `native:<note>` — a repo-native mechanism owns the role and
# this tooling defers to it, never shadows it. `genome doctor` reports those
# as legitimately-elsewhere, never as missing. `overlay:` would mark an
# operator-overlay role (none here — single-user repo).
#
# switchpost already runs the genome's conventions informally: the dated
# outline succession in docs/planning/ is the dated-frozen + supersede pattern,
# OUTLINE standing notes are the closed list, AGENTS.md §9 is the regression
# ledger. This map wires those mechanisms to the tooling instead of
# duplicating them.
[genome]
schema_version = 2
modules = ["core", "records", "agents"]   # the legacy kb.toml set, unchanged

[paths]
agents = "AGENTS.md"
entry = "AGENTS.md"            # §0.6 DOCUMENT MAP is the routing table
register = "TODO.md"           # seeded from OUTLINE-2026-10-17 (the frozen plan)
plans = "docs/planning"        # the dated outline/audit succession; the date is the freeze stamp
audits = "docs/planning"
decisions = "docs/decisions"   # AD-NNN, minted on ratified direction changes
archive = "docs/archive"      # tombstones at the original path, INDEX.md here
worklog = "worklog.md"         # the §8 multi-agent worklog, in-repo (path fixed 2026-10-17)
ledger = "native:OUTLINE standing notes — 'REJECTED on evidence' items (P6.1–P6.3, B12 ceiling) + the register's rejected rows"
regressions = "native:AGENTS.md §9 Known Pitfalls — the bites and the laws that prevent them, in prose"
workflows = "native:the current outline's wave structure (one working queue; sequential agents by §8's design)"
state = "native:the successor-outline pattern — each OUTLINE opens with 'State today' and supersedes its predecessor; git log carries the rest"
feed = "native:the §8 worklog protocol (worklog.md) — sequential agents, no parallel boards needed"
runbook = "native:AGENTS.md §3 build/test workflow + Makefile + SESSION_HOOKS.md"
asks = "native:no operator-questions register — open questions live in TODO.md's open/blocked rows ('Owner: user', 're-open when')"
records_index = "docs/decisions/README.md"   # the AD store's own README: what an AD is and where the standing laws live

[core]
# The dated dirs also hold living reference docs (PLAN v25, VENDOR_PINS,
# TARGETING) — only the succession files are dated-frozen, so lint checks
# dates on the pattern, not on every file in the dir.
dated_pattern = "OUTLINE-|AUDIT_|GAPS_"
# `.rs` in the AGENTS.md source-tree diagram is the Rust file EXTENSION, not a
# path: the diagram writes "The 43 `.rs` files under `src/social/`". The pointer
# check reads a backticked token as a file when it is file-shaped, and `.rs` is
# file-shaped by extension alone — so the sentence about an extension was read as
# a claim about a file called `.rs`, and the pointer it really names
# (`src/social/`) was never the problem. Naming the extension once here is the
# repo saying "this is prose", which is what pointer_ignore is for.
pointer_ignore = ".rs"
# The gate is the library test suite only. The full `cargo test` also builds
# the `tests/live_*` binaries, which call the real provider APIs and are not
# `#[ignore]`d — a full-suite gate would hit the network on every close.
gate = "cargo test --lib"
# The judgement the golden rules make non-negotiable, in their own order
checklist = [
  "the commit is pushed (or the reason it could not is written down)",
  "the build was verified: cargo check --lib --bin switchpost, and the frontend build",
  "a change touching HTML interpolation, file upload, auth or SQL was reviewed against the security rules",
  "no new sqlx::query! macros without a regenerated .sqlx/ cache",
  "no secret is in the commit",
  "the worklog entry says what changed and why",
]
# generated by the tooling, never committed by close
never_commit = ["target/**", "frontend/node_modules/**", "**/*.genome-lock", ".genome/**"]

[records]
# No generated records index: this repo's decisions live as AD-NNN files in
# docs/decisions/ and are listed by `genome rec list`, not by a zone.
zones = {}

[card]
# The `runbook` and `state` roles above are `native:` forms, so the card's
# operate class would otherwise be empty. These point at the sections that
# hold the answer; the `native:` roles stay the owner.
architecture = "docs/ARCHITECTURE.md#The parts"
operate = "AGENTS.md#3. Build & Test Workflow"
# The `state` role above is a `native:` form, so the card's status class would
# otherwise be empty. This points at the planning index, which is the stable
# path that always names the live outline and its status — the outline itself
# is dated and is superseded by the next one, so a pointer at it would go
# stale; the `native:` role stays the owner.
status = "docs/planning/README.md"
